services:
  postgres_db:
    build:
      context: ..
      dockerfile: Dockerfile_db
    container_name: postgres_db
    image: danizura/postgres_a
    env_file:
     - .env
    volumes:
      - ./sql.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/18/docker
    environment:
      - POSTGRES_PASSWORD 
    ports:
      - 5433:5432
volumes:
  postgres_data:
